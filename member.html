<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>입점 센터 화면 — 구현본 미리보기 (상태 전환 가능)</title>
<link rel="stylesheet" href="assets/guest-mode-cards.css">
<style>
  body{margin:0;background:#F7F7F9;font-family:"Pretendard",-apple-system,sans-serif}
  .page{padding:34px 40px 56px}
  .switch{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
  .switch button{font-weight:700;font-size:12.5px;line-height:1;font-family:inherit;padding:9px 14px;border-radius:9px;border:1px solid #E3E3E8;
    background:#fff;color:#55555c;cursor:pointer}
  .switch button.on{background:#16161C;border-color:#16161C;color:#fff}
  .switch .nav{margin-left:auto;font-weight:700;font-size:12.5px;line-height:1;font-family:inherit;color:#E42A6B;text-decoration:none;
    padding:9px 14px;border:1px solid #F6CBDB;border-radius:9px;background:#fff}
  .switch .cap{font-weight:700;font-size:11.5px;line-height:1;font-family:inherit;color:#8A8A93;padding:9px 2px 9px 0}
  .switch.flow{margin-bottom:22px}
  .switch.flow button.on{background:#D4004E;border-color:#D4004E}
  .log{margin-top:18px;font-size:12.5px;color:#6B6B73;min-height:18px}
  .gm-scope .gm-lead + .gm-grid{margin-bottom:34px}

  /* 목업 모달 — 실제 어드민에서는 기존 모달 컴포넌트로 대체 */
  .mo-bg{display:none;position:fixed;inset:0;background:rgba(22,22,28,.45);z-index:60;
    align-items:center;justify-content:center;padding:18px}
  .mo-bg.show{display:flex}
  .mo{width:min(560px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:18px;padding:24px;
    box-shadow:0 24px 60px rgba(22,22,28,.24)}
  .mo h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em;color:#202024}
  .mo .who{margin:6px 0 0;font-size:13px;color:#6B6B73;line-height:1.55}
  /* WHY: 비용 안심 문구가 폼 이탈을 막는 첫 문장 — 회색 본문에 묻히지 않게 잉크색 강조 */
  .mo .who b{color:var(--gm-text,#16161C);font-weight:800}
  .fld{margin-top:16px}
  .fld > label.q{display:block;font-size:13.5px;font-weight:800;color:#202024;letter-spacing:-.02em}
  .fld > label.q i{font-style:normal;color:#D4004E;margin-left:3px}
  .fld .hint{margin:4px 0 0;font-size:12px;color:#8A8A93;line-height:1.5}
  .fld .err{margin:5px 0 0;font-size:12px;font-weight:700;color:#C02440;display:none}
  .fld.bad .err{display:block}
  .fld.bad input,.fld.bad select,.fld.bad textarea{border-color:#E23A55}
  .fld.bad .grp{outline:1.5px solid #F6C7CD;outline-offset:4px;border-radius:8px}
  input[type=text],input[type=tel],input[type=number],select,textarea{
    height:40px;border-radius:10px;border:1px solid #ECECEF;background:#fff;
    font-weight:600;font-size:13.5px;font-family:inherit;color:#202024;padding:0 11px;box-sizing:border-box}
  textarea{height:auto;min-height:76px;padding:10px 11px;line-height:1.6;resize:vertical;width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid #FC2066;outline-offset:1px}
  .row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .row .grow{flex:1;min-width:120px}
  .radios{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .radios label{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;
    border:1px solid #ECECEF;background:#FBFBFC;font-size:12.5px;font-weight:700;color:#55555C;cursor:pointer}
  .radios label:has(input:checked){border-color:#FC2066;background:#FFF0F5;color:#B00042}
  .radios input{accent-color:#FC2066}
  .cbrow{display:flex;gap:8px;align-items:center;margin-top:7px;flex-wrap:wrap}
  .cbrow label.nm{flex:1;min-width:110px;display:inline-flex;align-items:center;gap:7px;
    font-size:13px;font-weight:700;color:#33333A;cursor:pointer}
  .cbrow input[type=checkbox]{width:16px;height:16px;accent-color:#FC2066;flex:none}
  .cbrow input[type=number]{width:78px}
  /* WHY 100% 한 줄 차지: 기기 이름은 라벨·개수칸과 같은 줄에 두면 320px에서 다 잘린다 */
  .cbrow input.othernm{flex:1 1 100%;min-width:0}
  /* WHY 카운터: maxlength 로 막히면 사장님은 "왜 더 안 써지지?" 하고 멈춘다. 남은 칸을 미리 보여준다.
     input 폭을 뺏지 않도록 아래 한 줄을 통째로 쓰고 우측 정렬만 한다(실측 maxlength 전제 유지). */
  .cbrow .othcnt{flex:1 1 100%;margin-top:-4px;text-align:right;
    font-size:11px;font-weight:700;color:#8A8A93;font-variant-numeric:tabular-nums}
  .cbrow .othcnt.is-max{color:#C02440}
  .cbrow select{width:150px;font-size:12.5px}
  .cbrow input:disabled,.cbrow select:disabled{background:#F7F7F9;color:#B4B4BC}
  .unit{width:76px}
  .sumbar{margin-top:16px;padding:11px 13px;border-radius:10px;background:#FDECEE;border:1px solid #F6C7CD;
    font-size:12.5px;font-weight:700;color:#C02440;display:none}
  .sumbar.show{display:block}
  /* WHY sticky 아님: 스크롤 도중 버튼 바가 마지막 입력칸을 덮어 가림 */
  .mbtns{display:flex;gap:8px;margin-top:20px}
  .mbtns button{flex:1;height:48px;border-radius:12px;font-weight:700;font-size:14.5px;font-family:inherit;cursor:pointer;border:1.5px solid transparent}
  .mbtns .go{background:#D4004E;color:#fff}
  .mbtns .go:hover{background:#B00042}
  .mbtns .sub{background:#fff;border-color:#ECECEF;color:#6B6B73}

  /* 견적서 */
  .qt{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}
  .qt th{font-size:11.5px;color:#8A8A93;text-align:right;font-weight:700;padding:8px 6px;border-bottom:1px solid #ECECEF}
  .qt th:first-child{text-align:left}
  .qt td{padding:10px 6px;border-bottom:1px solid #F3F3F6;text-align:right;font-weight:700}
  .qt td:first-child{text-align:left;font-weight:700}
  .qt tfoot td{border-bottom:0;padding:7px 6px;color:#6B6B73;font-weight:700}
  .qt tfoot tr.tot td{font-size:16px;font-weight:800;color:#202024;padding-top:11px;border-top:1.5px solid #16161C}
  .qmeta{margin-top:14px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
  .qmeta dt{color:#8A8A93;font-weight:700}
  .qmeta dd{margin:0;font-weight:800;color:#202024}

  /* ══════════ 현장 사진 업로드 (설치형 2종 공용) ══════════ */
  /* WHY: 사장님은 전기·설비 비전문가라 말로 물으면 답을 못 한다.
     "무엇을 프레임에 담을지"만 도식으로 보여주고 판단은 전문가가 사진으로 한다. */
  .ph-tips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .ph-tip{border-radius:10px;padding:9px 11px;font-size:11.5px;line-height:1.7;font-weight:700}
  .ph-tip b{display:block;font-size:11px;letter-spacing:-.01em;margin-bottom:3px}
  .ph-tip.good{background:#EFFBF5;border:1px solid #C4EDDC;color:#00795A}
  .ph-tip.bad{background:#F7F7F9;border:1px solid #E7E7EC;color:#8A8A93}
  .ph-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
  .ph-slot{border:1px solid #ECECEF;border-radius:14px;background:#fff;padding:9px 9px 11px;
    display:flex;flex-direction:column;min-width:0}
  .ph-slot.bad{border-color:#E23A55;background:#FFFAFB}
  .ph-media{position:relative;border-radius:10px;background:#FBFBFC;border:1.5px dashed #DEDEE4;
    aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
  .ph-media:hover{border-color:#FC2066;background:#FFF7FA}
  .ph-slot.bad .ph-media{border-color:#E23A55}
  .ph-media svg{width:84%;height:84%;display:block}
  .ph-cam{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);white-space:nowrap;
    font-size:11px;font-weight:800;color:#B00042;background:rgba(255,255,255,.92);
    border:1px solid #F6CBDB;border-radius:999px;padding:4px 9px}
  .ph-shot{display:none;width:100%;height:100%}
  .ph-shot img{width:100%;height:100%;object-fit:cover;display:block}
  .ph-slot.has .ph-media{border-style:solid;border-color:#ECECEF;background:#16161C}
  .ph-slot.has .ph-art,.ph-slot.has .ph-cam{display:none}
  .ph-slot.has .ph-shot{display:block}
  .ph-tt{margin-top:8px;font-size:12.5px;font-weight:800;color:#202024;letter-spacing:-.02em;
    line-height:1.45;word-break:keep-all;display:flex;gap:5px;align-items:flex-start;flex-wrap:wrap}
  .ph-badge{flex:none;font-size:10px;font-weight:800;border-radius:999px;padding:2px 7px;
    background:#F2F2F5;color:#8A8A93;border:1px solid #E7E7EC}
  .ph-badge.req{background:#FFF0F5;color:#B00042;border-color:#F6CBDB}
  .ph-g{margin:5px 0 0;font-size:11.5px;line-height:1.6;color:#8A8A93;word-break:keep-all}
  .ph-more{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .ph-th{position:relative;width:44px;height:34px;border-radius:7px;overflow:hidden;border:1px solid #ECECEF}
  .ph-th img{width:100%;height:100%;object-fit:cover;display:block}
  .ph-th button{position:absolute;top:1px;right:1px;width:15px;height:15px;border-radius:50%;border:0;
    background:rgba(22,22,28,.7);color:#fff;font-weight:800;font-size:10px;line-height:1;font-family:inherit;cursor:pointer;padding:0}
  /* WHY margin-top:auto — 가이드 문구 길이가 슬롯마다 달라서, 버튼을 카드 바닥에 붙여야 행이 안 흐트러진다 */
  .ph-acts{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
  .ph-b{font-weight:800;font-size:11px;line-height:1;font-family:inherit;padding:7px 9px;border-radius:8px;cursor:pointer;
    border:1px solid #ECECEF;background:#fff;color:#55555C}
  .ph-b:hover{border-color:#D6D6DD}
  .ph-b.del{color:#C02440;border-color:#F6C7CD}
  .ph-b.del:hover{background:#FDECEE}

  @media (min-width:760px){ .ph-grid{grid-template-columns:repeat(3,1fr)} }
  @media (max-width:900px){
    .page{padding:22px 16px 40px}
    .mo{padding:20px 16px;border-radius:16px}
    .cbrow select{width:100%}
  }
  @media (max-width:400px){
    .ph-grid{gap:8px}
    .ph-slot{padding:7px 7px 9px}
    .ph-g{font-size:11px}
  }
</style>
</head>
<body>
<div class="page">
  <div class="switch">
    <span class="cap">공통</span>
    <button data-mode="mixed" class="on">혼합 (기본)</button>
    <button data-mode="NONE">전체 미신청</button>
    <button data-mode="PENDING">전체 검토중</button>
    <button data-mode="APPROVED">전체 승인완료</button>
    <button data-mode="REJECTED">전체 반려</button>
    <a class="nav" href="index.html">← Guest mode 화면 보기</a>
    <a class="nav" href="admin.html">최고관리자 화면 →</a>
  </div>
  <div class="switch flow" id="flowSwitch">
    <span class="cap">설치형 2종 단계</span>
  </div>

  <div id="root"></div>
  <div class="log" id="log"></div>
</div>

<div class="mo-bg" id="moBg"><div class="mo" id="mo"></div></div>

<script>
const PENDING_CTA = '신청 검토중 · 평균 1~2영업일';

/* 섹션 1 — 노출·판촉 세팅. instant:true 카드는 승인 절차 없이 바로 쓰는 기능이라
   상태칩 없이 CTA가 항상 활성이다(실제 어드민과 동일). */
const PROMO = [
  {key:'coupon',title:'맞춤형 쿠폰',benefitHtml:'할인조건 내 마음대로, <em>쿠폰으로 강조 노출까지</em>',
   desc:'최소주문금액 등 할인조건을 직접 설정해 쿠폰을 발행할 수 있어요. 쿠폰을 발행하면 지도와 목록에서 우리 센터가 강조 표시되고, 상위노출 확률도 더 올라가요.',
   image:'08_coupon.png',instant:true,cta:{none:'쿠폰 발행하기'},manageUrl:'/admin/coupon'},
  {key:'timesale',title:'타임세일 선착순 이벤트',benefitHtml:'지금 이 시간만, <em>선착순 특가로 신규 회원 몰이</em>',
   desc:'타임세일·선착순 할인 이벤트를 열 수 있어요. 이벤트가 열리면 앱에서 카운트다운과 함께 강조 표시되고, 상위노출 확률도 더 올라가요.',
   image:'09_timesale.png',instant:true,cta:{none:'타임세일 이벤트 열기'},manageUrl:'/admin/timesale'},
  {key:'subscription',title:'월 정기결제 구독멤버십',benefitHtml:'넷플릭스처럼, <em>매달 자동으로 들어오는 매출</em>',
   desc:'월 정기결제 상품을 판매해 회원이 더 쉽게 등록하게 만들고, 반복 매출로 역대 최대 매출에 도전해 보세요.',
   image:'04_subscription.png',recommended:true,cta:{none:'구독멤버십 판매 시작하기',pending:PENDING_CTA,approved:'구독멤버십 관리하러 가기'},manageUrl:'/admin/subscription'},
  {key:'daypass',title:'1일권',benefitHtml:'부담 없는 첫 방문, <em>1일권으로 체험 고객 유치</em>',
   desc:'하루 이용권을 판매할 수 있어요. 1일권을 열어두면 근처에서 운동할 곳을 찾는 고객에게 우리 센터가 강조 표시되고, 체험 고객이 정기 회원으로 이어집니다.',
   image:'10_daypass.png',instant:true,cta:{none:'1일권 판매 시작하기'},manageUrl:'/admin/daypass'},
];

/* 섹션 2 — 운영 자동화. access_control·iot_control은 기기 설치·시공이 선행돼야 해서
   install:true → 단순 3상태가 아니라 별도 flow 파이프라인을 탄다 (guestFeatures.ts 참조). */
const OPS = [
  {key:'access_control',title:'무인 출입제어 시스템',benefitHtml:'회원이 스스로 여는 출입문, <em>상주 인력 0명</em>',
   desc:'회원이 직접 출입문을 열고 닫아요. 직원은 언제 어디서든 누가 출입했는지 확인하고 원격으로 문을 여닫을 수 있어요.',
   image:'05_access.png',install:true,
   cta:{none:'무인 출입제어 도입신청하기',pending:PENDING_CTA,approved:'출입제어 관리하러 가기'},manageUrl:'/admin/access'},
  {key:'norder',title:'N 오더',benefitHtml:'센터 안 음료·자물쇠·굿즈를 <em>앱에서 바로 판매</em>',
   desc:'회원이 상품을 확인하고 원터치결제로 클릭 한 번에 주문해요. 무인 판매로 부가 매출이 붙습니다.',
   image:'06_norder.png',cta:{none:'N 오더 이용시작하기',pending:PENDING_CTA,approved:'N 오더 관리하러 가기'},manageUrl:'/admin/norder'},
  {key:'iot_control',title:'IoT 원격자동제어',benefitHtml:'센터에 없어도, <em>조명·냉난방을 앱으로 원격 제어</em>',
   desc:'조명·냉난방·환기 등 센터 설비를 앱에서 원격으로 켜고 끌 수 있어요. 오픈·마감 시간에 맞춰 자동 스케줄을 걸어두면 설비가 알아서 켜지고 꺼져서, 센터에 나가지 않아도 운영 준비가 끝나 있습니다.',
   image:'07_iot.png',recommended:true,isNew:true,wide:true,install:true,
   cta:{none:'IoT 원격제어 도입신청하기',pending:PENDING_CTA,approved:'IoT 제어판 열기'},manageUrl:'/admin/iot'},
];

const MIXED = {subscription:'NONE',norder:'REJECTED'};
const REJECT_REASON = '제출하신 사업자 정보와 센터 정보가 일치하지 않아 반려되었어요. 정보를 확인해 수정하신 뒤 다시 신청해 주세요.';

/* ── 기존 3상태 로직 (설치형 2종 외 전 카드) — 변경 없음 ── */
const chipLabel = s => s==='APPROVED'?'승인완료 · 사용중' : s==='PENDING'?'신청됨 · 검토중' : s==='REJECTED'?'반려됨' : '미신청';
const chipClass = s => s==='APPROVED'?'s-approved' : s==='PENDING'?'s-pending' : s==='REJECTED'?'s-rejected' : 's-none';
const ctaVariant = (s,rec) => s==='APPROVED'?'done' : s==='PENDING'?'wait' : s==='REJECTED'?'fill' : (rec?'fill':'line');

/* ══════════ 설치형 2종 파이프라인 ══════════ */
const FLOW_STEPS = [
  {flow:'APPLIED',label:'신청접수',short:'신청'},
  {flow:'CONSULT',label:'현장확인',short:'현장'},
  {flow:'QUOTED',label:'견적확인',short:'견적'},
  {flow:'INSTALLING',label:'설치·시공',short:'시공'},
  {flow:'INSTALLED',label:'시공완료',short:'완료'},
  {flow:'ACTIVE',label:'사용중',short:'사용'},
];
const flowStepIndex = f => f==='REJECTED' ? 0 : FLOW_STEPS.findIndex(s=>s.flow===f);
const flowChipLabel = f => ({APPLIED:'접수 완료 · 검토중',CONSULT:'상담·현장 확인 예정',QUOTED:'견적 도착 · 확인해 주세요',
  INSTALLING:'설치·시공 진행중',INSTALLED:'시공완료 · 사용 승인 대기',ACTIVE:'승인완료 · 사용중',
  REJECTED:'반려됨',CANCELED:'신청 취소됨'}[f] ?? '미신청');
const flowChipClass = f => ({APPLIED:'s-pending',CONSULT:'s-pending',INSTALLING:'s-pending',INSTALLED:'s-pending',
  QUOTED:'s-quoted',ACTIVE:'s-approved',REJECTED:'s-rejected',CANCELED:'s-canceled'}[f] ?? 's-none');
const flowCtaLabel = (d,f) => ({APPLIED:'신청서 접수됨 · 검토중',CONSULT:'담당자 배정중 · 연락 예정',

function stepper(flow){
  const idx = flowStepIndex(flow);
  const fail = flow==='REJECTED';
  const idle = flow==='NONE' || flow==='CANCELED';
  const steps = FLOW_STEPS.map((s,i)=>{
    let cls='', mark = i+1;
    if(fail){ if(i===0){cls='is-fail'; mark='!';} }
    else if(!idle){ if(i<idx){cls='is-done'; mark='✓';} else if(i===idx){cls='is-cur';} }
    return `<div class="gm-step ${cls}"><i>${mark}</i><b>${s.label}</b><u>${s.short}</u></div>`;
  }).join('');
  return `<div class="gm-steps${idle?' is-idle':''}" role="list" aria-label="도입 진행 단계">${steps}</div>`;
}

function flowNote(key, st){
  const f = st.flow;
  if(f==='NONE') return `<div class="gm-note is-muted"><b>왜 바로 못 쓰나요?</b>· 이 서비스는 센터에 기기를 직접 설치해야 작동해서, 신청 → 현장 확인 → 견적 → 시공 순서로 진행돼요. <strong>신청서를 넣어도 비용은 발생하지 않아요.</strong> 견적을 보고 결정하시면 돼요.</div>`;
  if(f==='APPLIED') return `<div class="gm-note"><b>접수 완료</b>· 신청서 잘 받았어요. 담당자가 내용을 확인하고 1~2영업일 안에 연락드려요. 지금은 따로 하실 일 없이 기다려 주시면 돼요.</div>`;
  if(f==='CONSULT'){
    const c = st.consult ?? DEMO_CONSULT[key];
    return `<div class="gm-note"><b>상담·현장 확인</b>· 접수가 승인됐어요. 담당자가 등록하신 연락처로 연락드려 올려주신 사진을 함께 보며 현장 상태를 확인하고 방문 일정을 잡아요. 지금은 따로 하실 일 없이 연락을 기다려 주시면 돼요.
      <dl><dt>배정 담당자</dt><dd>${c.manager}</dd><dt>방문 예정일</dt><dd>${c.visitDate}</dd></dl></div>`;
  }
  if(f==='QUOTED'){
    const q = st.quote ?? DEMO_QUOTE[key];
    const t = quoteTotals(q.lines);
    return `<div class="gm-note is-quote"><b>견적 도착</b>· 현장 확인 결과를 반영한 견적이 나왔어요. 내용을 보고 수락하시면 시공 일정을 잡아드려요. 지금 결정이 어려우시면 «보류·문의하기»로 담당자에게 물어보셔도 돼요.
      <dl><dt>총액 (VAT 포함)</dt><dd>${won(t.total)}원</dd><dt>예상 시공기간</dt><dd>${q.leadTime}</dd><dt>견적 유효기한</dt><dd>${q.validUntil}</dd></dl></div>`;
  }
  if(f==='INSTALLING'){
    const p = st.progress ?? DEMO_PROGRESS[key];
    return `<div class="gm-note"><b>시공 진행중</b>· 시공 당일에는 담당자가 현장에 방문해요. 영업에 지장 없는 시간대로 맞춰 드리니, 편한 시간이 있으면 담당자에게 알려주세요.
      <dl><dt>진행 상태</dt><dd>${p.note}</dd><dt>완료 예정일</dt><dd>${p.dueDate}</dd></dl></div>`;
  }
  if(f==='INSTALLED') return `<div class="gm-note"><b>시공 완료 · 마지막 단계예요</b>· 설치가 모두 끝났어요. 니짐내짐 최종 확인만 마치면 바로 쓰실 수 있어요(보통 1영업일 안에 끝나요). 승인되면 앱으로 바로 알려드릴게요.</div>`;
  if(f==='REJECTED') return `<div class="gm-reject"><b>반려 사유</b>· ${st.rejectedReason ?? DEMO_REJECT}</div>`;
  if(f==='CANCELED') return `<div class="gm-note is-muted"><b>취소 사유</b>· ${st.canceledReason ?? DEMO_CANCEL}</div>`;
  return '';
}

function card(d, st, wide){
  const install = !!d.install;
  const instant = !!d.instant;
  const badge = d.isNew ? '<span class="gm-badge is-new">NEW</span>'
    : (d.recommended ? '<span class="gm-badge">추천</span>' : '');

  if(install){
    const s = FLOW[d.key];
    const f = s.flow;
    const v = flowCtaVariant(f);
    return `<article class="gm-card${d.recommended?' is-rec':''}${wide?' is-wide':''}" data-key="${d.key}">
      <div class="gm-chd"><h3>${badge}${d.title}</h3>
        <span class="gm-chip ${flowChipClass(f)}"><span class="gm-dot"></span>${flowChipLabel(f)}</span></div>
      <p class="gm-ben">${d.benefitHtml}</p>
      <p class="gm-desc">${d.desc}</p>
      ${stepper(f)}
      ${flowNote(d.key, s)}
      <div class="gm-thumb"><img src="img/${d.image}" alt=""></div>
      <div class="gm-spacer"></div>
      <button type="button" class="gm-cta v-${v}" data-flowkey="${d.key}" data-flow="${f}"
        ${flowCtaDisabled(f)?'disabled aria-disabled="true"':''}>${flowCtaLabel(d,f)}</button>
    </article>`;
  }

  const v = instant ? 'fill' : ctaVariant(st, d.recommended);
  const chip = instant ? '' :
    `<span class="gm-chip ${chipClass(st)}"><span class="gm-dot"></span>${chipLabel(st)}</span>`;
  const label = instant ? d.cta.none
    : (st==='APPROVED'?d.cta.approved : st==='PENDING'?d.cta.pending : st==='REJECTED'?'다시 신청하기' : d.cta.none);
  return `<article class="gm-card${d.recommended?' is-rec':''}${wide?' is-wide':''}" data-key="${d.key}">
    <div class="gm-chd"><h3>${badge}${d.title}</h3>${chip}</div>
    <p class="gm-ben">${d.benefitHtml}</p>
    <p class="gm-desc">${d.desc}</p>
    ${(!instant && st==='REJECTED')?`<div class="gm-reject"><b>반려 사유</b>· ${d.rejectReason??REJECT_REASON}</div>`:''}
    <div class="gm-thumb"><img src="img/${d.image}" alt=""></div>
    <div class="gm-spacer"></div>
    <button type="button" class="gm-cta v-${v}" data-key="${d.key}" data-status="${instant?'INSTANT':st}"
      data-url="${d.manageUrl}" ${(!instant && st==='PENDING')?'disabled aria-disabled="true"':''}>${label}</button>
  </article>`;
}

      <h1 class="gm-h1">입점 센터 홈</h1>
      <div class="gm-lead"><h2>다양한 세팅으로 내 센터를 더 돋보이게 만들어보세요</h2>
        <p>쿠폰·이벤트·상품을 열면 앱에서 우리 센터가 강조 표시되고 상위노출 확률이 올라가요.</p></div>
      <div class="gm-grid">${promo}</div>
      <div class="gm-lead"><h2>센터 운영을 더 스마트하게 해보세요</h2>
        <p>신청하시면 검토 후 승인해 드려요. 설치가 필요한 서비스는 담당자가 현장을 확인한 뒤 견적·시공을 안내해 드립니다.</p></div>
      <div class="gm-grid">${ops}</div>
    </div>`;

  document.querySelectorAll('.gm-cta[data-key]').forEach(b=>{
    b.addEventListener('click',()=>{
      const {key,status,url} = b.dataset;
      if(status==='PENDING'){ logEl('검토중 — 클릭 무시됨(중복 신청 차단)'); return; }
      logEl((status==='APPROVED'||status==='INSTANT') ? `[라우팅] ${key} → ${url}`
        : status==='REJECTED' ? `[신청 모달] ${key} 재신청 폼 열기 (반려 사유 안내 포함)`
        : `[신청 모달] ${key} 신청 폼 열기`);
    });
  });
  document.querySelectorAll('.gm-cta[data-flowkey]').forEach(b=>{
    b.addEventListener('click',()=>{
      const key = b.dataset.flowkey, f = b.dataset.flow;
      if(flowCtaDisabled(f)){ logEl('진행중 단계 — 센터가 할 수 있는 행동이 없어 CTA를 비활성화했습니다.'); return; }
      if(f==='ACTIVE'){ logEl(`[라우팅] ${key} → ${OPS.find(d=>d.key===key).manageUrl}`); return; }
      if(f==='QUOTED'){ openQuote(key); return; }
      openSurvey(key);
    });
  });
  syncFlowSwitch();
}
const logEl = t => document.getElementById('log').textContent = t;

/* ══════════ 모달 ══════════ */
const moBg = document.getElementById('moBg'), mo = document.getElementById('mo');
const closeMo = () => { moBg.classList.remove('show'); mo.innerHTML=''; };
moBg.addEventListener('mousedown', e => { if(e.target===moBg) closeMo(); });
document.addEventListener('keydown', e => { if(e.key==='Escape' && moBg.classList.contains('show')) closeMo(); });
/* WHY gm-scope: 모달 안에서도 카드와 같은 토큰(.gm-note/.gm-reject 색상 변수)을 쓴다 */
const openMo = html => { mo.className = 'mo gm-scope'; mo.innerHTML = html; moBg.classList.add('show'); mo.scrollTop = 0; };

/* ── 현장 사진 업로드 ──
   프로토타입이라 실제 업로드 없이 URL.createObjectURL 로컬 미리보기만 한다.
   실제 엔드포인트·필드 스키마는 API_SPEC.md §5.4.1 참조. */
let PHOTOS = {};      // slotKey → [{url, name}]
let CUR_SLOTS = [];   // 현재 열린 폼의 슬롯 정의

function photoFieldHtml(f){
  const slot = s => `<div class="ph-slot" data-slot="${s.key}">
    <div class="ph-media" data-pick="${s.key}" role="button" tabindex="0" aria-label="${s.title} 사진 올리기">
      <div class="ph-art">${photoArt(s.art)}</div>
      <div class="ph-shot"></div>
      <span class="ph-cam">＋ 사진 찍기</span>
    </div>
    <div class="ph-tt">${s.title}<span class="ph-badge${s.required?' req':''}" data-badge="${s.key}">${s.required?'필수':'선택'}</span></div>
    <p class="ph-g">${s.guide}</p>
    ${s.multi?`<div class="ph-more" data-more="${s.key}"></div>`:''}
    <div class="ph-acts" data-acts="${s.key}"></div>
    <input type="file" accept="image/*" capture="environment" ${s.multi?'multiple':''} data-file-cam="${s.key}" hidden>
    <input type="file" accept="image/*" ${s.multi?'multiple':''} data-file-lib="${s.key}" hidden>
  </div>`;
  return `<div class="ph-wrap">
    <div class="ph-tips">
      <div class="ph-tip good"><b>이렇게 찍어주세요</b>밝을 때 · 정면에서 · 흔들리지 않게</div>
      <div class="ph-tip bad"><b>이러면 다시 찍어야 해요</b>너무 멀리서 · 역광 · 일부만 잘림</div>
    </div>
    <div class="ph-grid">${f.slots.map(slot).join('')}</div>
  </div>`;
}

/* 선택 슬롯이라도 조건(reqIf)이 충족되면 필수로 승격된다 (예: 냉난방 선택 → 에어컨 사진) */
function slotRequired(s){
  if(s.required) return true;
  if(s.reqIf){
    const cb = mo.querySelector(`[data-cb="${s.reqIf.cb}"][data-i="${s.reqIf.i}"]`);
    return !!(cb && cb.checked);
  }
  return false;
}
function updateSlotBadges(){
  CUR_SLOTS.forEach(s=>{
    const b = mo.querySelector(`[data-badge="${s.key}"]`);
    if(!b) return;
    const req = slotRequired(s);
    b.textContent = req ? '필수' : '선택';
    b.classList.toggle('req', req);
  });
}
function paintSlot(key){
  const s = CUR_SLOTS.find(x=>x.key===key);
  const el = mo.querySelector(`.ph-slot[data-slot="${key}"]`);
  if(!s || !el) return;
  const arr = PHOTOS[key] ?? [];
  el.classList.toggle('has', arr.length>0);
  if(arr.length) el.classList.remove('bad');
  el.querySelector('.ph-shot').innerHTML = arr[0] ? `<img src="${arr[0].url}" alt="${s.title} 미리보기">` : '';
  const more = el.querySelector('[data-more]');
  if(more) more.innerHTML = arr.slice(1).map((p,i)=>
    `<span class="ph-th"><img src="${p.url}" alt=""><button type="button" data-del="${key}" data-idx="${i+1}" aria-label="사진 삭제">×</button></span>`).join('');
  el.querySelector('[data-acts]').innerHTML = arr.length
    ? `<button type="button" class="ph-b" data-cam="${key}">${s.multi?'＋ 더 찍기':'다시 찍기'}</button>
       <button type="button" class="ph-b" data-lib="${key}">앨범</button>
       <button type="button" class="ph-b del" data-del="${key}" data-idx="0">삭제</button>`
    : `<button type="button" class="ph-b" data-lib="${key}">앨범에서 고르기</button>`;
}
function bindPhotos(){
  const wrap = mo.querySelector('.ph-wrap');
  if(!wrap) return;
  wrap.addEventListener('click', e=>{
    const del = e.target.closest('[data-del]');
    if(del){
      const k = del.dataset.del, i = Number(del.dataset.idx);
      PHOTOS[k]?.splice(i,1);
      if(!PHOTOS[k]?.length) delete PHOTOS[k];
      paintSlot(k); return;
    }
    const lib = e.target.closest('[data-lib]');
    if(lib){ mo.querySelector(`[data-file-lib="${lib.dataset.lib}"]`).click(); return; }
    const cam = e.target.closest('[data-cam]');
    if(cam){ mo.querySelector(`[data-file-cam="${cam.dataset.cam}"]`).click(); return; }
    const pick = e.target.closest('[data-pick]');
    if(pick) mo.querySelector(`[data-file-cam="${pick.dataset.pick}"]`).click();
  });
  wrap.addEventListener('keydown', e=>{
    const pick = e.target.closest('[data-pick]');
    if(pick && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); pick.click(); }
  });
  wrap.querySelectorAll('input[type=file]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const key = inp.dataset.fileCam ?? inp.dataset.fileLib;
      const s = CUR_SLOTS.find(x=>x.key===key);
      const files = [...inp.files];
      inp.value = '';
      if(!s || !files.length) return;
      const list = PHOTOS[key] ?? (PHOTOS[key] = []);
      if(!s.multi) list.length = 0;
      files.forEach(f => list.push({url: URL.createObjectURL(f), name: f.name}));
      paintSlot(key);
      logEl(`📷 [${s.title}] 사진 ${files.length}장 추가 — 미리보기만 하는 목업이라 서버 업로드는 하지 않습니다.`);
    });
  });
  CUR_SLOTS.forEach(s=>paintSlot(s.key));
}

/* ── 상담용 신청서 폼 ── */
function fieldHtml(f){
  const req = f.required ? '<i aria-hidden="true">*</i>' : '';
  const hint = f.hint ? `<p class="hint">${f.hint}</p>` : '';
  let body = '';
  if(f.type==='photos'){
    body = photoFieldHtml(f);
  } else if(f.type==='checkbox-qty'){
    body = `<div class="grp">${f.options.map((o,i)=>`<div class="cbrow">
      <label class="nm"><input type="checkbox" data-cb="${f.name}" data-i="${i}">${o}</label>
      <input type="number" min="1" value="1" data-qty="${f.name}" data-i="${i}" disabled aria-label="${o} 개수">
      <span style="font-size:12px;color:#8A8A93;font-weight:700">개</span>${
        f.other===o ? `<input type="text" class="othernm" data-other="${f.name}" data-i="${i}" disabled hidden
        maxlength="${f.otherMaxLength ?? OTHER_NAME_MAX_LENGTH}"
        placeholder="${f.otherPlaceholder??'어떤 기기인지 적어주세요'}" aria-label="기타 기기 이름"
        aria-describedby="othcnt-${f.name}-${i}"><span class="othcnt" id="othcnt-${f.name}-${i}"
        data-othcnt="${f.name}" data-i="${i}" hidden aria-live="polite">0/${f.otherMaxLength ?? OTHER_NAME_MAX_LENGTH}</span>` : ''}</div>`).join('')}</div>`;
  } else if(f.type==='radio'){
    body = `<div class="radios grp">${f.options.map(o=>`<label><input type="radio" name="${f.name}" value="${o}">${o}</label>`).join('')}</div>`;
  } else if(f.type==='select'){
    body = `<div class="row"><select class="grow" data-v="${f.name}"><option value="">선택해 주세요</option>${f.options.map(o=>`<option>${o}</option>`).join('')}</select></div>`;
  } else if(f.type==='textarea'){
    body = `<textarea data-v="${f.name}" placeholder="${f.placeholder??''}"></textarea>`;
  } else {
    body = `<div class="row"><input class="grow" type="${f.type==='tel'?'tel':'text'}" data-v="${f.name}" placeholder="${f.placeholder??''}"></div>`;
  }
  return `<div class="fld" data-f="${f.name}"><label class="q">${f.label}${req}</label>${hint}${body}
    <p class="err" data-err="${f.name}"></p></div>`;
}

/* 상한에 닿으면 색을 바꿔 "더 못 쓰는 이유"를 알려준다 */
function paintOtherCount(inp, cnt){
  const max = Number(inp.getAttribute('maxlength')) || OTHER_NAME_MAX_LENGTH;
  const n = [...inp.value].length;
  cnt.textContent = n >= max ? `${n}/${max} 최대예요` : `${n}/${max}`;
  cnt.classList.toggle('is-max', n >= max);
}

function openSurvey(key){
  const d = OPS.find(x=>x.key===key);
  const st = FLOW[key];
  const again = st.flow==='REJECTED' || st.flow==='CANCELED';
  const prev = st.flow==='REJECTED'
    ? `<div class="gm-reject" style="margin-top:12px"><b>지난 반려 사유</b>· ${st.rejectedReason ?? DEMO_REJECT}</div>`
    : st.flow==='CANCELED'
      ? `<div class="gm-note is-muted" style="margin-top:12px"><b>지난 취소 사유</b>· ${st.canceledReason ?? DEMO_CANCEL}</div>`
      : '';
  PHOTOS = {};
  CUR_SLOTS = PHOTO_SLOTS[key] ?? [];
  openMo(`<h3>${d.title} — 도입 상담신청서</h3>
    <p class="who"><b>제출해도 비용은 발생하지 않아요.</b> 견적을 받아보고 결정하시면 됩니다.<br>센터마다 현장이 다 달라서 사진 몇 장이면 전문가가 정확하게 판단해요. 어려운 건 안 여쭤볼게요.</p>
    ${prev}
    ${FORMS[key].map(fieldHtml).join('')}
    <div class="sumbar" id="sumbar"></div>
    <div class="mbtns"><button class="sub" data-close>취소</button>
      <button class="go" id="submitSurvey">${again?'다시 상담신청하기':'상담신청 제출하기'}</button></div>`);

  bindPhotos();
  mo.querySelectorAll('[data-cb]').forEach(cb=>{
    cb.addEventListener('change',()=>{
      const n = cb.dataset.cb, i = cb.dataset.i;
      const qty = mo.querySelector(`[data-qty="${n}"][data-i="${i}"]`);
      if(qty) qty.disabled = !cb.checked;
      const oth = mo.querySelector(`[data-other="${n}"][data-i="${i}"]`);
      if(oth){
        oth.disabled = !cb.checked; oth.hidden = !cb.checked;
        if(!cb.checked) oth.value='';
        const cnt = mo.querySelector(`[data-othcnt="${n}"][data-i="${i}"]`);
        if(cnt){ cnt.hidden = !cb.checked; paintOtherCount(oth, cnt); }
      }
      updateSlotBadges();   // 냉난방 체크 → 에어컨 사진 슬롯이 필수로 승격
    });
  });
  mo.querySelectorAll('input.othernm').forEach(oth=>{
    const cnt = mo.querySelector(`[data-othcnt="${oth.dataset.other}"][data-i="${oth.dataset.i}"]`);
    if(cnt) oth.addEventListener('input', () => paintOtherCount(oth, cnt));
  });
  mo.querySelector('[data-close]').onclick = closeMo;
  mo.querySelector('#submitSurvey').onclick = () => submitSurvey(key);
}

function submitSurvey(key){
  const fields = FORMS[key];
  mo.querySelectorAll('.fld').forEach(el=>el.classList.remove('bad'));
  mo.querySelectorAll('.ph-slot').forEach(el=>el.classList.remove('bad'));
  const bad = [], data = {};
  let photoMissing = 0;
  const setErr = (name,msg) => {
    const fld = mo.querySelector(`.fld[data-f="${name}"]`);
    fld.classList.add('bad');
    fld.querySelector(`[data-err="${name}"]`).textContent = msg;
    bad.push(fld);
  };
  const val = n => (mo.querySelector(`[data-v="${n}"]`)?.value ?? '').trim();
  const radio = n => mo.querySelector(`input[name="${n}"]:checked`)?.value ?? '';

  fields.forEach(f=>{
    if(f.type==='photos'){
      const missing = f.slots.filter(s => slotRequired(s) && !(PHOTOS[s.key]?.length));
      if(missing.length){
        missing.forEach(s => mo.querySelector(`.ph-slot[data-slot="${s.key}"]`)?.classList.add('bad'));
        photoMissing = missing.length;
        return setErr(f.name, `아래 빨갛게 표시된 ${missing.length}칸에 사진을 올려주세요. — ${missing.map(s=>s.title).join(' · ')}`);
      }
      data[f.name] = f.slots
        .filter(s => PHOTOS[s.key]?.length)
        .map(s => `${s.title} ${PHOTOS[s.key].length}장`).join(', ');
    } else if(f.type==='checkbox-qty'){
      const picked = [];
      let otherBlank = false;
      mo.querySelectorAll(`[data-cb="${f.name}"]`).forEach(cb=>{
        if(!cb.checked) return;
        const i = cb.dataset.i;
        const q = Number(mo.querySelector(`[data-qty="${f.name}"][data-i="${i}"]`).value)||0;
        const oth = mo.querySelector(`[data-other="${f.name}"][data-i="${i}"]`);
        const nm = oth ? oth.value.trim() : '';   // 기타는 사장님이 적은 이름으로 치환해 담는다
        if(oth && !nm) otherBlank = true;
        picked.push({name: oth ? nm : f.options[i], qty:q, bad:q<1});
      });
      if(f.required && !picked.length) return setErr(f.name,'해당하는 항목을 1개 이상 선택해 주세요.');
      if(otherBlank) return setErr(f.name,'어떤 기기인지 적어주세요.');
      if(picked.some(p=>p.bad)) return setErr(f.name,'선택한 항목의 개수를 1 이상으로 입력해 주세요.');
      data[f.name] = picked.map(p=>`${p.name} ${p.qty}개`).join(', ');
    } else if(f.type==='radio'){
      const v = radio(f.name);
      if(f.required && !v) return setErr(f.name,'항목을 선택해 주세요.');
      data[f.name] = v;
    } else {
      const v = val(f.name);
      if(f.required && !v) return setErr(f.name,'필수 입력 항목이에요.');
      if(f.type==='tel' && v && !/^[0-9-+ ]{9,}$/.test(v)) return setErr(f.name,'연락처 형식을 확인해 주세요. (예: 010-0000-0000)');
      data[f.name] = v;
    }
  });

  const sum = document.getElementById('sumbar');
  if(bad.length){
    const rest = bad.length - (photoMissing ? 1 : 0);
    sum.textContent = photoMissing
      ? `사진 ${photoMissing}장을 더 올려주세요.${rest ? ` 그리고 필수 문항 ${rest}개를 확인해 주세요.` : ''}`
      : `필수 문항 ${bad.length}개를 확인해 주세요.`;
    sum.classList.add('show');
    bad[0].scrollIntoView({block:'center',behavior:'smooth'});
    (bad[0].querySelector('input,select,textarea,.ph-media'))?.focus({preventScroll:true});
    return;
  }
  const shots = Object.values(PHOTOS).reduce((n,a)=>n+a.length, 0);
  FLOW[key] = {flow:'APPLIED', survey:data, photoCount:shots};
  closeMo();
  logEl(`✅ [${OPS.find(d=>d.key===key).title}] 상담신청서 접수 — 사진 ${shots}장 첨부 · 단계: 신청접수 · 검토중 (POST …/install-apply)`);
  render();
}

/* ── 견적서 확인 ── */
function openQuote(key){
  const d = OPS.find(x=>x.key===key);
  const q = FLOW[key].quote ?? DEMO_QUOTE[key];
  const t = quoteTotals(q.lines);
  openMo(`<h3>${d.title} — 견적서</h3>
    <p class="who">현장 확인 결과를 반영한 견적이에요. 수락하시면 담당자가 시공 일정을 잡아 연락드려요.</p>
    <table class="qt"><thead><tr><th>항목</th><th>수량</th><th>단가</th><th>합계</th></tr></thead>
    <tbody>${q.lines.map(l=>`<tr><td>${l.name}</td><td>${l.qty}</td><td>${won(l.unitPrice)}</td><td>${won(l.qty*l.unitPrice)}</td></tr>`).join('')}</tbody>
    <tfoot>
      <tr><td colspan="3">공급가 합계</td><td>${won(t.subtotal)}</td></tr>
      <tr><td colspan="3">부가세 (10%)</td><td>${won(t.vat)}</td></tr>
      <tr class="tot"><td colspan="3">총액</td><td>${won(t.total)}원</td></tr>
    </tfoot></table>
    <dl class="qmeta"><dt>예상 시공기간</dt><dd>${q.leadTime}</dd><dt>견적 유효기한</dt><dd>${q.validUntil}</dd></dl>
    <div class="mbtns"><button class="sub" id="qHold">보류 · 문의하기</button>
      <button class="go" id="qAccept">견적 수락</button></div>`);
  mo.querySelector('#qHold').onclick = () => {
    closeMo();
    logEl(`💬 [${d.title}] 견적 보류·문의 접수 — 담당자에게 전달됐고 단계는 «견적확인»에 그대로 머뭅니다.`);
  };
  mo.querySelector('#qAccept').onclick = () => {
    FLOW[key] = {...FLOW[key], flow:'INSTALLING', quote:q, progress:DEMO_PROGRESS[key]};
    closeMo();
    logEl(`✅ [${d.title}] 견적 수락 — 단계: 설치·시공 진행중 (POST …/quote/accept)`);
    render();
  };
}

/* ══════════ 목업 컨트롤 ══════════ */
const FLOW_MODES = [
  ['NONE','① 미신청'],['APPLIED','② 신청접수'],['CONSULT','③ 상담대기'],['QUOTED','④ 견적도착'],
  ['INSTALLING','⑤ 시공중'],['INSTALLED','⑥ 시공완료'],['ACTIVE','⑦ 사용중'],
  ['REJECTED','↳ 반려'],['CANCELED','↳ 취소'],
];
function setFlow(f){
  ['access_control','iot_control'].forEach(k=>{
    FLOW[k] = {flow:f,
      consult:DEMO_CONSULT[k], quote:DEMO_QUOTE[k], progress:DEMO_PROGRESS[k],
      rejectedReason:DEMO_REJECT, canceledReason:DEMO_CANCEL};
  });
  logEl(`설치형 2종 단계 → ${f}`);
  render();
}
function syncFlowSwitch(){
  const cur = FLOW.access_control.flow===FLOW.iot_control.flow ? FLOW.access_control.flow : null;
  document.querySelectorAll('#flowSwitch button').forEach(b=>b.classList.toggle('on', b.dataset.flow===cur));
}
document.getElementById('flowSwitch').insertAdjacentHTML('beforeend',
  FLOW_MODES.map(([f,l])=>`<button data-flow="${f}">${l}</button>`).join('') +
  `<button data-flow="__step">다음 단계 ▶</button>`);
document.querySelectorAll('#flowSwitch button').forEach(b=>{
  b.addEventListener('click',()=>{
    if(b.dataset.flow==='__step'){
      const order = FLOW_STEPS.map(s=>s.flow);
      const cur = FLOW.access_control.flow;
      const i = order.indexOf(cur);
      setFlow(i<0 ? 'APPLIED' : order[(i+1)%order.length]);
      return;
    }
    setFlow(b.dataset.flow);
  });
});
document.querySelectorAll('.switch:not(.flow) button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.switch:not(.flow) button').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    MODE = btn.dataset.mode;
    logEl('');
    // 공통 전환은 설치형 2종에도 대응 단계를 매핑해 함께 보여준다
    const map = {NONE:'NONE', PENDING:'APPLIED', APPROVED:'ACTIVE', REJECTED:'REJECTED'};
    if(map[MODE]) setFlow(map[MODE]);
    else { FLOW.access_control = {flow:'QUOTED'}; FLOW.iot_control = {flow:'NONE'}; render(); }
  });
});
render();
</script>
</body>
</html>
